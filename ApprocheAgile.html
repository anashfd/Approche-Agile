<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approche Agile</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        header {
            width: 280px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            position: sticky;
            top: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            margin-top: 0;
        }

        header h2 {
            font-size: 1.1rem;
            color: #6c757d;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        nav .tab {
            margin: 0;
            padding: 12px 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        nav .tab:hover,
        nav .tab.activeTab {
            background-color: #0056b3;
            color: white;
        }

        main {
            flex: 1;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            min-height: 80vh;
        }

        .etapesList li {
            margin: 10px;
            font-weight: bold;
        }

        img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 6px;
        }

        h3 {
            color: #0056b3;
        }

        a.link {
            display: inline-block;
            padding: 10px;
            border-radius: 5px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
        }

        /* boites */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .box {
            background-color: #e9ecef;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            font-weight: bold;
            color: #0056b3;
            align-self: start;
        }

        .box:hover {
            border-color: #0056b3;
        }

        .box.big {
            font-size: 1.2rem;
            padding: 30px 20px;
            text-align: center;
        }

        .body ul,
        .body ol {
            margin: 8px 0;
            padding-left: 22px;
        }

        table.kb {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
            text-align: center;
        }

        table.kb th,
        table.kb td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        table.kb th {
            background: #e9ecef;
        }

        .chap {
            display: none;
        }

        .chap.active {
            display: block;
        }

        nav .label {
            margin: 12px 0 0;
            font-size: .8rem;
            color: #6c757d;
            font-weight: bold;
        }

        .group {
            margin: 28px 0 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #e9ecef;
        }

        .intro {
            color: #555;
        }

        .nextprev {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 10px;
        }

        .nextprev button {
            background: #e9ecef;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
            color: #0056b3;
        }

        .nextprev button:hover {
            background: #0056b3;
            color: white;
        }

        .plan li {
            margin: 8px 0;
            color: #0056b3;
            cursor: pointer;
            font-weight: bold;
        }

        .plan li:hover {
            text-decoration: underline;
        }

        .res a {
            color: #0056b3;
        }

        figure {
            margin: 20px 0;
        }

        figcaption {
            text-align: center;
            font-size: .85rem;
            color: #6c757d;
        }

        .vid {
            position: relative;
            padding-top: 56.25%;
            margin: 14px 0 4px;
        }

        .vid iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 6px;
        }

        .src {
            font-size: .85rem;
            color: #6c757d;
            margin: 0 0 12px;
        }

        .flow {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin: 12px 0;
            font-size: .9rem;
        }

        .flow span {
            background: #fff;
            border: 1px solid #0056b3;
            border-radius: 14px;
            padding: 4px 10px;
        }

        .modal-body svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        .modal-body {
            line-height: 1.5;
        }

        /* popup */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            position: relative;
            background: white;
            border-radius: 8px;
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .modal-box h2 {
            margin-top: 0;
            padding-right: 30px;
            color: #0056b3;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            border: none;
            background: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <header>
        <h1>Approche Agile</h1>
        <h2>Chapitres</h2>
        <nav id="menu"></nav>
    </header>

    <main id="content"></main>

    <div class="modal" id="modal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="Fermer">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        /* page elements */
        const menu = document.getElementById("menu");
        const content = document.getElementById("content");
        const modal = document.getElementById("modal");
        const modalTitle = document.getElementById("modalTitle");
        const modalBody = document.getElementById("modalBody");

        /* popup */
        function openPopup(item) {
            modalTitle.textContent = item.title;
            modalBody.innerHTML = item.text;
            modal.classList.add("open");
        }

        function closePopup() {
            modal.classList.remove("open");
            modalBody.innerHTML = "";
        }

        document.getElementById("modalClose").addEventListener("click", closePopup);

        modal.addEventListener("click", function (event) {
            if (event.target === modal) {
                closePopup();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closePopup();
            }
        });

        /* boxes */
        function createBox(title, isBig, onClick) {
            const box = document.createElement("div");
            box.className = isBig ? "box big" : "box";
            box.textContent = title;
            box.addEventListener("click", onClick);
            return box;
        }

        function createGrid(items) {
            const grid = document.createElement("div");
            grid.className = "grid";

            items.forEach(function (item) {
                grid.appendChild(createBox(item.title, false, function () {
                    openPopup(item);
                }));
            });

            return grid;
        }

        /* chapters */
        function openChapter(id) {
            chapters.forEach(function (chapter) {
                const isActive = chapter.id === id;
                document.getElementById("chap-" + chapter.id).classList.toggle("active", isActive);
                document.getElementById("tab-" + chapter.id).classList.toggle("activeTab", isActive);
            });

            if (id === "methods") {
                showFamilies();
            }

            window.scrollTo(0, 0);
        }

        function createButton(text, chapterId) {
            const button = document.createElement("button");
            button.textContent = text;
            button.addEventListener("click", function () {
                openChapter(chapterId);
            });
            return button;
        }

        function createNavigation(index) {
            const bar = document.createElement("div");
            bar.className = "nextprev";

            const left = document.createElement("span");
            const right = document.createElement("span");

            if (index > 0) {
                const previous = chapters[index - 1];
                left.appendChild(createButton("← " + previous.title, previous.id));
            }

            if (index < chapters.length - 1) {
                const next = chapters[index + 1];
                right.appendChild(createButton(next.title + " →", next.id));
            }

            bar.appendChild(left);
            bar.appendChild(right);
            return bar;
        }

        function createChapter(chapter, index) {
            const section = document.createElement("section");
            section.className = "chap";
            section.id = "chap-" + chapter.id;

            if (chapter.type === "methods") {
                section.innerHTML =
                    '<h2 id="methodsTitle"></h2>' +
                    '<div class="grid" id="methodsGrid"></div>' +
                    '<div id="methodsDetail"></div>';
            } else {
                const title = chapter.number ? chapter.number + ". " + chapter.title : chapter.title;
                let html = "<h2>" + title + "</h2>";

                if (chapter.intro) {
                    html += '<p class="intro">' + chapter.intro + "</p>";
                }
                if (chapter.html) {
                    html += chapter.html;
                }
                section.innerHTML = html;

                if (chapter.groups) {
                    chapter.groups.forEach(function (group) {
                        const heading = document.createElement("h3");
                        heading.className = "group";
                        heading.textContent = group.title;
                        section.appendChild(heading);
                        section.appendChild(createGrid(group.items));
                    });
                }
            }

            section.appendChild(createNavigation(index));
            content.appendChild(section);
        }

        /* menu */
        function createMenu() {
            let currentPart = "";

            chapters.forEach(function (chapter) {
                if (chapter.part && chapter.part !== currentPart) {
                    currentPart = chapter.part;
                    const label = document.createElement("div");
                    label.className = "label";
                    label.textContent = currentPart;
                    menu.appendChild(label);
                }

                const tab = document.createElement("div");
                tab.className = "tab";
                tab.id = "tab-" + chapter.id;
                tab.textContent = chapter.number ? chapter.number + ". " + chapter.title : chapter.title;
                tab.addEventListener("click", function () {
                    openChapter(chapter.id);
                });
                menu.appendChild(tab);
            });
        }

        function createPlan() {
            const plan = document.getElementById("plan");

            chapters.forEach(function (chapter) {
                if (chapter.number) {
                    const line = document.createElement("li");
                    line.textContent = chapter.title;
                    line.addEventListener("click", function () {
                        openChapter(chapter.id);
                    });
                    plan.appendChild(line);
                }
            });
        }

        /* methods */
        function showFamilies() {
            document.getElementById("methodsTitle").textContent = "Méthodes de gestion d'un projet";
            document.getElementById("methodsDetail").innerHTML = "";

            const grid = document.getElementById("methodsGrid");
            grid.innerHTML = "";

            families.forEach(function (family) {
                grid.appendChild(createBox(family.title, true, function () {
                    showMethods(family);
                }));
            });
        }

        function showMethods(family) {
            document.getElementById("methodsTitle").textContent = family.title;
            document.getElementById("methodsDetail").innerHTML = "<p>" + family.intro + "</p>";

            const grid = document.getElementById("methodsGrid");
            grid.innerHTML = "";

            family.methods.forEach(function (method) {
                grid.appendChild(createBox(method.title, true, function () {
                    showDetail(method);
                }));
            });
        }

        function showDetail(method) {
            document.getElementById("methodsTitle").textContent = method.title;
            document.getElementById("methodsGrid").innerHTML = "";

            let html = "<p>" + method.text + "</p>";
            if (method.img) {
                html += '<img src="' + method.img + '" alt="' + method.title + '">';
            }
            if (method.link) {
                html += '<a class="link" href="' + method.link + '" target="_blank" rel="noopener">Read more</a>';
            }
            document.getElementById("methodsDetail").innerHTML = html;
        }

        /* start */
        let chapterNumber = 0;
        chapters.forEach(function (chapter) {
            if (chapter.id !== "accueil") {
                chapterNumber++;
                chapter.number = chapterNumber;
            }
        });

        createMenu();
        chapters.forEach(createChapter);
        createPlan();
        openChapter("accueil");
    </script>

</body>

</html>
